# Ursprüngliche Angaben von Caddy/Tunnel übernehmen, ohne Proxy die eigenen.
map $http_x_forwarded_proto $weiter_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}
map $http_x_forwarded_host $weiter_host {
    default $http_x_forwarded_host;
    ''      $http_host;
}

server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    gzip        on;
    gzip_types  text/plain text/css application/javascript application/json image/svg+xml;

    # Nur die Einlass-Routen (Geräte-Token) — Backoffice- und Kassen-API bleiben
    # von dieser (ggf. ins Internet gestellten) App aus unerreichbar.
    location /api/einlass/ {
        proxy_pass         http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $weiter_proto;
        proxy_set_header   X-Forwarded-Host  $weiter_host;
    }

    location ~* \.(js|css|svg|png|ico|woff2)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    location / {
        # index.html nie zwischenspeichern — neue Versionen sofort ausliefern
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
