# ── Client-IP je Eingang (Rate-Limit + Audit im Backend) ─────────────────────
# Identisch in allen App-nginx.conf (Test: backend/tests/nginx-client-ip.test.ts).
# Das Backend liest die Client-IP NUR aus X-Real-IP, das jede location mit
# $kassa_client_ip ÜBERSCHREIBT. Vom Client mitgeschickte X-Real-IP,
# X-Forwarded-For oder CF-Connecting-IP zählen nie — welcher Angabe getraut
# wird, entscheidet allein der Eingang (Port):
#   80    direkt (LAN, veröffentlichter Port) → Absender der Verbindung
#   8090  Caddy (Profil „proxy")  → letzter X-Forwarded-For-Eintrag (Caddy
#         verwirft mitgeschickte Werte und trägt den echten Absender ein)
#   8091  Cloudflare-Tunnel       → CF-Connecting-IP (setzt Cloudflare selbst)
# 8090/8091 sind nicht veröffentlicht: nur Container im Kassa-Netz erreichen
# sie. Docker Desktop (Windows/macOS) liefert auf Port 80 für JEDEN LAN-Client
# dieselbe Gateway-Adresse — angemeldete Geräte trennt das Backend daher über
# ihren Token.
map $http_x_forwarded_for $kassa_ip_caddy {
    default                                   $remote_addr;
    "~(?<kassa_xff_ip>[0-9A-Fa-f:.]+)\s*$"     $kassa_xff_ip;
}
map $http_cf_connecting_ip $kassa_ip_tunnel {
    default                                   $remote_addr;
    "~^\s*(?<kassa_cf_ip>[0-9A-Fa-f:.]+)\s*$"  $kassa_cf_ip;
}
map $server_port $kassa_client_ip {
    default  $remote_addr;
    8090     $kassa_ip_caddy;
    8091     $kassa_ip_tunnel;
}
# ── Ende Client-IP ───────────────────────────────────────────────────────────

# Ursprüngliche Angaben von Caddy übernehmen, ohne Caddy die eigenen —
# das Backend baut daraus die Ticket-Adresse im PDF.
map $http_x_forwarded_proto $weiter_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}
map $http_x_forwarded_host $weiter_host {
    default $http_x_forwarded_host;
    ''      $http_host;
}

server {
    listen 80;
    listen 8090;   # Eingang für Caddy (siehe Client-IP oben)
    listen 8091;   # Eingang für den Cloudflare-Tunnel (siehe Client-IP oben)
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    gzip        on;
    gzip_types  text/plain text/css application/javascript application/json image/svg+xml;

    # Nur die öffentlichen Ticket-Routen — Backoffice- und Kassen-API bleiben
    # von dieser (ggf. ins Internet gestellten) App aus unerreichbar.
    location /api/ticketshop/ {
        proxy_pass         http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $kassa_client_ip;
        proxy_set_header   X-Forwarded-For   $kassa_client_ip;
        proxy_set_header   X-Forwarded-Proto $weiter_proto;
        proxy_set_header   X-Forwarded-Host  $weiter_host;
    }

    location ~* \.(js|css|svg|png|ico|woff2)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    location / {
        # index.html nie zwischenspeichern — neue Versionen sofort ausliefern
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
